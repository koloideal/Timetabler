[project]
name = "timetabler"
version = "0.1.0"
description = "Timetabler — schedule broadcasting bot for NGAEK"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "adaptix>=3.0.0b12",
    "aiogram>=3.29.0",
    "aiogram-dialog>=2.4.0",
    "alembic>=1.16.5",
    "asyncpg>=0.30.0",
    "dishka>=1.7.2",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.1",
    "orjson>=3.11.8",
    "sqlalchemy>=2.0.43",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "mypy>=1.18.2",
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
    "ruff>=0.14.4",
    "watchfiles>=1.1.1",
]

[tool.ruff]
line-length = 110

[tool.isort]
line_length = 90

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
